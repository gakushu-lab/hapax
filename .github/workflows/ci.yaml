name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: docker compose up -d
      - run: pnpm exec tsc -b
      - run: pnpm lint
      - name: DynamoDB Local と S3Mock の起動を待つ
        run: |
          until curl -s -o /dev/null http://127.0.0.1:8000; do sleep 1; done
          until curl -s -o /dev/null http://127.0.0.1:9090; do sleep 1; done
      - run: pnpm test
      - run: pnpm build
      - run: pnpm build-api

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: docker compose up -d
      - name: DynamoDB Local と S3Mock の起動を待つ
        run: |
          until curl -s -o /dev/null http://127.0.0.1:8000; do sleep 1; done
          until curl -s -o /dev/null http://127.0.0.1:9090; do sleep 1; done
      - run: pnpm e2e
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/

  terraform-plan:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::090213310133:role/LabGitHubDeploy
          aws-region: ap-northeast-3
      - uses: hashicorp/setup-terraform@v4
      - name: terraform plan
        working-directory: infra
        env:
          TF_VAR_turnstile_secret: ${{ secrets.TURNSTILE_SECRET }}
          TF_VAR_api_domain: ${{ vars.API_DOMAIN }}
        run: |
          terraform init -input=false
          terraform fmt -check
          terraform plan -input=false -lock=false
