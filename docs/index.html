<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <title>hapax API</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swagger-ui-dist@5.34.0/swagger-ui.css" />
  </head>
  <body>
    <div id="swagger-ui"></div>
    <script src="https://cdn.jsdelivr.net/npm/swagger-ui-dist@5.34.0/swagger-ui-bundle.js"></script>
    <script>
      // hapax の API は別のオリジンからの呼び出しと Turnstile のない送信を断るので、画面からの試し送信を無効にする
      SwaggerUIBundle({ url: "openapi.yaml", dom_id: "#swagger-ui", supportedSubmitMethods: [] });
    </script>
  </body>
</html>
